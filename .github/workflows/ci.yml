name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Keep in line with the Aspire.AppHost.Sdk version in src/AppHost/AppHost.csproj.
  ASPIRE_CLI_VERSION: 13.6.3

# Job names are the status check names required by branch protection: rename them there too.
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The AppHost build needs the Aspire CLI (DCP and dashboard come from its bundle).
      - name: Install Aspire CLI
        run: dotnet tool install --global Aspire.Cli --version "$ASPIRE_CLI_VERSION"

      - run: dotnet restore MealPlanner.slnx
      - run: dotnet build MealPlanner.slnx --no-restore --configuration Release
      - run: dotnet test MealPlanner.slnx --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # The committed OpenAPI document and generated client must match the backend (docs/adr/0002).
  api-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build Api (writes src/Api/Api.json)
        run: dotnet build src/Api/Api.csproj

      - name: Generate client
        working-directory: src/web
        run: |
          npm ci
          npm run generate:api

      - name: Fail if generated files are out of date
        run: |
          if [ -n "$(git status --porcelain -- src/Api/Api.json src/web/src/api/generated)" ]; then
            echo "::error::Api.json or the generated client is out of date. Run 'dotnet build src/Api' and 'npm run generate:api' in src/web, then commit."
            git status --porcelain -- src/Api/Api.json src/web/src/api/generated
            git diff -- src/Api/Api.json src/web/src/api/generated
            exit 1
          fi
